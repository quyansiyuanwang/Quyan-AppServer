[package]
name = "quyan"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Quyan native command-line client"
license = "MIT"
repository = "https://github.com/quyansiyuanwang/Quyan-AppServer"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6.0"
futures = "0.3"
hmac = "0.12"
hex = "0.4"
keyring = "4.2"
open = "5.3"
progenitor-client = "0.14"
rand = "0.9"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "smallvec", "ansi"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[build-dependencies]
prettyplease = "0.2"
progenitor = "0.14"
openapiv3 = "2.2"
serde_json = "1.0"
syn = "2.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wbico.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quyan</title>

    <!-- Critical CSS inline for instant render -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: #fff;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      html.dark body {
        background: #0d1117;
      }
      #app {
        min-height: 100vh;
      }
      .app-boot {
        display: grid;
        min-height: 100vh;
        place-items: center;
        color: #303133;
      }
      html.dark .app-boot {
        color: #e5eaf3;
      }
      .app-boot__inner {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        font-weight: 600;
      }
      .app-boot__spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #c0c4cc;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Theme preflight: apply dark class before app mounts -->
    <script>
      ;(() => {
        try {
          const storageKey = 'ThemeToggle-isDark'
          const cookieName = 'appserver.preference.theme'
          const readCookie = (name) => {
            const prefix = `${encodeURIComponent(name)}=`
            const item = document.cookie
              .split(';')
              .map((entry) => entry.trim())
              .find((entry) => entry.startsWith(prefix))
            if (!item) return null
            try {
              return decodeURIComponent(item.slice(prefix.length))
            } catch {
              return null
            }
          }
          const saved = readCookie(cookieName) || localStorage.getItem(storageKey)
          const prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          let isDark
          if (saved === 'true' || saved === 'dark') isDark = true
          else if (saved === 'false' || saved === 'light') isDark = false
          else if (saved === 'auto' || saved == null) isDark = prefersDark
          else isDark = prefersDark
          document.documentElement.classList.toggle('dark', !!isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (e) {
          /* no-op */
        }
      })()
    </script>
  </head>

  <body>
    <div id="app">
      <div class="app-boot" role="status" aria-label="Quyan loading">
        <div class="app-boot__inner">
          <span class="app-boot__spinner" aria-hidden="true"></span>
          <span>Quyan</span>
        </div>
      </div>
    </div>
    <p id="boot-repair" style="text-align: center; padding: 1rem">
      <a href="/repair.html">无法登录或页面无法打开？检查与修复 / Trouble signing in? Repair</a>
    </p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

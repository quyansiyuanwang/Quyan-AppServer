name: Build and Deploy

on:
  push:
    branches: [master]
    paths:
      - 'apps/backend/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy-backend:
        description: 'Deploy backend'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'

  deploy-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event.inputs.deploy-backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log deployment context
        run: |
          echo "[deploy] event_name=${{ github.event_name }}"
          echo "[deploy] ref=${{ github.ref }}"
          echo "[deploy] ref_name=${{ github.ref_name }}"
          echo "[deploy] sha=${{ github.sha }}"
          echo "[deploy] actor=${{ github.actor }}"
          echo "[deploy] deploy-backend=${{ github.event.inputs.deploy-backend || 'n/a' }}"
          echo "[deploy] latest commit:" 
          git log -1 --pretty=format:'[deploy] commit=%H%n[deploy] short_commit=%h%n[deploy] subject=%s%n[deploy] author=%an%n[deploy] commit_time=%cI'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-backend
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-backend.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Inject Empty Build Info
        run: pnpm --filter @appserver/backend run build:info:stub

      - name: Check explicit dependencies
        run: pnpm --filter @appserver/backend run check:explicit-deps

      - name: Generate Prisma Client
        run: pnpm --filter @appserver/backend run db:generate

      - name: Build
        run: pnpm --filter @appserver/backend run build:full:prod

      - name: Log generated build info
        run: |
          echo "[deploy] apps/backend/src/generated/buildInfo.ts"
          sed -n '1,40p' apps/backend/src/generated/buildInfo.ts

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${{ secrets.REMOTE_BACKEND_PATH }}"

      - name: Validate remote path
        run: |
          PATH_VALUE="${{ secrets.REMOTE_BACKEND_PATH }}"
          if [ -z "$PATH_VALUE" ] || [ "$PATH_VALUE" = "/" ]; then
            echo "ERROR: REMOTE_BACKEND_PATH is unsafe: '$PATH_VALUE'. Refusing to deploy."
            exit 1
          fi

      - name: Deploy
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'dist/docs' \
            --exclude 'logs' \
            apps/backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_BACKEND_PATH }}/

      - name: Install dependencies on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_BACKEND_PATH }} && node -e \"const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.dependencies['@appserver/shared'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')\" && pnpm install --config.confirmModulesPurge=false"

      - name: Ensure remote logs directory is writable
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_BACKEND_PATH }} && mkdir -p logs && chmod u+rwx logs && echo '[deploy] remote logs dir' && ls -ld logs && echo '[deploy] remote logs dir probe' && touch logs/.write-test && rm -f logs/.write-test"

      - name: Log remote build info before reload
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_BACKEND_PATH }} && echo '[deploy] remote buildInfo.ts' && sed -n '1,40p' src/generated/buildInfo.ts && echo '[deploy] remote dist/index.cjs timestamp' && stat dist/index.cjs"

      - name: Generate Prisma Client on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_BACKEND_PATH }} && npx prisma generate"

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_BACKEND_PATH }} && pnpm run db:migrate:deploy"

      - name: Reload PM2
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_BACKEND_PATH }} && if [ ! -f ecosystem.config.cjs ]; then echo '[deploy] ecosystem.config.cjs not found'; exit 1; fi && if [ ! -f dist/index.cjs ]; then echo '[deploy] dist/index.cjs not found'; exit 1; fi && pm2 startOrReload ./ecosystem.config.cjs --env production"

      - name: Log PM2 status after reload
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "pm2 status backend && pm2 logs backend --lines 80 --nostream"

name: Build and Deploy

on:
  push:
    branches: [master]
    paths:
      - 'apps/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy-backend:
        description: 'Deploy backend'
        type: boolean
        default: true
      deploy-frontend:
        description: 'Deploy frontend'
        type: boolean
        default: false
      deploy-static-site:
        description: 'Deploy static site'
        type: boolean
        default: false
      deploy-docs-site:
        description: 'Deploy docs site'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      static-site: ${{ steps.filter.outputs.static-site }}
      docs-site: ${{ steps.filter.outputs.docs-site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            frontend:
              - 'apps/frontend/**'
            static-site:
              - 'apps/static-site/**'
            docs-site:
              - 'apps/docs-site/**'

  # ─── Backend ────────────────────────────────────────────────────
  deploy-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event.inputs.deploy-backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-backend
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-backend.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Inject Empty Build Info
        run: pnpm --filter @appserver/backend run build:info:stub

      - name: Check explicit dependencies
        run: pnpm --filter @appserver/backend run check:explicit-deps

      - name: Generate Prisma Client
        run: pnpm --filter @appserver/backend run db:generate

      - name: Build
        run: pnpm --filter @appserver/backend run build:full:prod

      - name: Copy package files to dist
        run: |
          cp apps/backend/package.json pnpm-lock.yaml apps/backend/dist/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${{ secrets.REMOTE_BACKEND_PATH }}/dist"

      - name: Validate remote path
        run: |
          PATH_VALUE="${{ secrets.REMOTE_BACKEND_PATH }}"
          if [ -z "$PATH_VALUE" ] || [ "$PATH_VALUE" = "/" ]; then
            echo "ERROR: REMOTE_BACKEND_PATH is unsafe: '$PATH_VALUE'. Refusing to deploy."
            exit 1
          fi

      - name: Deploy
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'docs' \
            apps/backend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_BACKEND_PATH }}/dist/
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            apps/backend/ecosystem.config.cjs \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_BACKEND_PATH }}/ecosystem.config.cjs

      - name: Install dependencies on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_BACKEND_PATH }}/dist && CI=true pnpm install --prod --frozen-lockfile"

      - name: Reload PM2
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_BACKEND_PATH }} && if [ ! -f ecosystem.config.cjs ]; then echo '[deploy] ecosystem.config.cjs not found in REMOTE_BACKEND_PATH'; exit 1; fi && if [ ! -f dist/index.cjs ]; then echo '[deploy] dist/index.cjs not found'; exit 1; fi && pm2 startOrReload ./ecosystem.config.cjs --env production"

  # ─── Frontend ───────────────────────────────────────────────────
  # 关闭自动部署，手动触发时勾选 deploy-frontend 可部署
  deploy-frontend:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-frontend
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        run: pnpm --filter @appserver/frontend run openapi:generate

      - name: Build
        run: pnpm --filter @appserver/frontend run build:prod

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Validate remote path
        run: |
          PATH_VALUE="${{ secrets.REMOTE_FRONTEND_PATH }}"
          if [ -z "$PATH_VALUE" ] || [ "$PATH_VALUE" = "/" ]; then
            echo "ERROR: REMOTE_FRONTEND_PATH is unsafe: '$PATH_VALUE'. Refusing to deploy."
            exit 1
          fi
          if [ ! -f apps/frontend/dist/index.html ]; then
            echo "ERROR: dist/index.html not found. Build may have failed. Refusing to deploy."
            exit 1
          fi

      - name: Deploy
        run: |
          rsync -az --delete \
            --exclude='.user.ini' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            apps/frontend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_FRONTEND_PATH }}/

  # ─── Static Site ────────────────────────────────────────────────
  deploy-static-site:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-static-site == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-static
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-static.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build (Production)
        run: pnpm --filter @appserver/static-site run build:prod

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Validate remote path
        run: |
          PATH_VALUE="${{ secrets.REMOTE_STATICSITE_PATH }}"
          if [ -z "$PATH_VALUE" ] || [ "$PATH_VALUE" = "/" ]; then
            echo "ERROR: REMOTE_STATICSITE_PATH is unsafe: '$PATH_VALUE'. Refusing to deploy."
            exit 1
          fi
          if [ ! -f apps/static-site/dist/index.html ]; then
            echo "ERROR: dist/index.html not found. Build may have failed. Refusing to deploy."
            exit 1
          fi

      - name: Deploy to Production
        run: |
          rsync -az --delete \
            --exclude='.user.ini' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            apps/static-site/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_STATICSITE_PATH }}/

  # ─── Docs Site ──────────────────────────────────────────────────
  deploy-docs-site:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-docs-site == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-docs
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-docs.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @appserver/docs-site run build:prod

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Validate remote path
        run: |
          PATH_VALUE="${{ secrets.REMOTE_DOCS_PATH }}"
          if [ -z "$PATH_VALUE" ] || [ "$PATH_VALUE" = "/" ]; then
            echo "ERROR: REMOTE_DOCS_PATH is unsafe: '$PATH_VALUE'. Refusing to deploy."
            exit 1
          fi
          if [ ! -f apps/docs-site/dist/index.html ]; then
            echo "ERROR: dist/index.html not found. Build may have failed. Refusing to deploy."
            exit 1
          fi

      - name: Deploy
        run: |
          rsync -az --delete \
            --exclude='.user.ini' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            apps/docs-site/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_DOCS_PATH }}/

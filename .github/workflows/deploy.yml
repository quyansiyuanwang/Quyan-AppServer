name: Build and Deploy

on:
  push:
    branches: [master]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy-backend:
        description: 'Deploy backend'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  deploy-backend:
    needs: changes
    if: ${{ (github.ref_name == 'master' || github.ref_name == 'staging') && (needs.changes.outputs.backend == 'true' || github.event.inputs.deploy-backend == 'true') }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Log deployment context
        run: |
          echo "[deploy] event_name=${{ github.event_name }}"
          echo "[deploy] ref=${{ github.ref }}"
          echo "[deploy] ref_name=${{ github.ref_name }}"
          echo "[deploy] environment=${{ github.ref_name == 'master' && 'production' || 'staging' }}"
          echo "[deploy] sha=${{ github.sha }}"
          echo "[deploy] actor=${{ github.actor }}"
          echo "[deploy] deploy-backend=${{ github.event.inputs.deploy-backend || 'n/a' }}"
          echo "[deploy] latest commit:" 
          git log -1 --pretty=format:'[deploy] commit=%H%n[deploy] short_commit=%h%n[deploy] subject=%s%n[deploy] author=%an%n[deploy] commit_time=%cI'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache workspace node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node22-workspace-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: '1'
        run: pnpm install --frozen-lockfile --prod=false

      - name: Inject Empty Build Info
        run: pnpm --filter @quyan/backend run build:info:stub

      - name: Check explicit dependencies
        run: pnpm --filter @quyan/backend run check:explicit-deps

      - name: Generate Prisma Client
        run: pnpm --filter @quyan/backend run db:generate

      - name: Build
        run: pnpm --filter @quyan/backend run build:full:prod

      - name: Validate built Prisma runtime
        run: pnpm --filter @quyan/backend exec node scripts/validate-prisma-runtime.mjs --target-runtime

      - name: Validate built native runtime dependencies
        run: |
          node - <<'NODE'
          const { createRequire } = require('node:module')
          const runtimeRequire = createRequire(`${process.cwd()}/apps/backend/dist/index.cjs`)
          runtimeRequire('bcrypt')
          runtimeRequire('node-gyp-build')
          console.log('[deploy] bcrypt native runtime validated')
          NODE

      - name: Prepare server dependency lockfile
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cp apps/backend/package.json "$temp_dir/package.json"
          node - "$temp_dir/package.json" <<'NODE'
          const fs = require('node:fs')
          const packagePath = process.argv[2]
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          delete packageJson.dependencies?.['@quyan/shared']
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE
          pnpm --dir "$temp_dir" install --lockfile-only --ignore-workspace --ignore-scripts
          cp "$temp_dir/package.json" apps/backend/package.json
          cp "$temp_dir/pnpm-lock.yaml" apps/backend/pnpm-lock.yaml

      - name: Log generated build info
        run: |
          echo "[deploy] apps/backend/src/generated/buildInfo.ts"
          sed -n '1,40p' apps/backend/src/generated/buildInfo.ts

      - name: Validate deployment inputs
        env:
          REMOTE_BACKEND_PATH: ${{ secrets.REMOTE_BACKEND_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [[ -z "$REMOTE_BACKEND_PATH" || "$REMOTE_BACKEND_PATH" == "/" || "$REMOTE_BACKEND_PATH" != /* || "$REMOTE_BACKEND_PATH" == *..* || ! "$REMOTE_BACKEND_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "ERROR: REMOTE_BACKEND_PATH is unsafe: '$REMOTE_BACKEND_PATH'."
            exit 1
          fi
          if [[ -z "$SSH_HOST" || ! "$SSH_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "ERROR: SSH_HOST is invalid."
            exit 1
          fi
          if [[ -z "$SSH_USER" || ! "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]; then
            echo "ERROR: SSH_USER is invalid."
            exit 1
          fi
          if [[ ! "$SSH_PORT" =~ ^[0-9]+$ ]] || (( SSH_PORT < 1 || SSH_PORT > 65535 )); then
            echo "ERROR: SSH_PORT is invalid: '$SSH_PORT'."
            exit 1
          fi

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        env:
          REMOTE_BACKEND_PATH: ${{ secrets.REMOTE_BACKEND_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p -- '$REMOTE_BACKEND_PATH'"

      - name: Deploy backend
        env:
          REMOTE_BACKEND_PATH: ${{ secrets.REMOTE_BACKEND_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            --exclude '.env' \
            --exclude '/node_modules/' \
            --exclude 'dist/docs' \
            --exclude 'logs' \
            apps/backend/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_BACKEND_PATH/"

      - name: Install production dependencies on server
        env:
          REMOTE_BACKEND_PATH: ${{ secrets.REMOTE_BACKEND_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_BACKEND_PATH' && PRISMA_SKIP_POSTINSTALL_GENERATE=1 pnpm install --prod --frozen-lockfile --ignore-workspace --config.confirmModulesPurge=false"

      - name: Validate runtime dependencies on server
        env:
          REMOTE_BACKEND_PATH: ${{ secrets.REMOTE_BACKEND_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_BACKEND_PATH' && node -e 'const { createRequire } = require(\"node:module\"); const runtimeRequire = createRequire(process.cwd() + \"/dist/index.cjs\"); runtimeRequire(\"bcrypt\"); runtimeRequire(\"node-gyp-build\"); console.log(\"[deploy] bcrypt native runtime validated\")'"

      - name: Validate Prisma runtime on server
        env:
          REMOTE_BACKEND_PATH: ${{ secrets.REMOTE_BACKEND_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_BACKEND_PATH' && node scripts/validate-prisma-runtime.mjs --target-runtime"

      - name: Run database migrations
        env:
          REMOTE_BACKEND_PATH: ${{ secrets.REMOTE_BACKEND_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_BACKEND_PATH' && pnpm run db:migrate:deploy"

      - name: Reload PM2
        env:
          REMOTE_BACKEND_PATH: ${{ secrets.REMOTE_BACKEND_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_BACKEND_PATH' && pm2 startOrReload ./ecosystem.config.cjs --env production --update-env"

      - name: Log PM2 status after reload
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "pm2 status backend && pm2 logs backend --lines 80 --nostream"

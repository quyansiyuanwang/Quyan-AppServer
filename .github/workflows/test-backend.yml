name: Backend Test Pipeline

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Manual runs are intentional: select the required suite.'
        type: choice
        default: full
        options: [api, full]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      api: ${{ steps.filter.outputs.api }}
      full: ${{ steps.filter.outputs.full }}
      files: ${{ steps.filter.outputs.files_files || '[]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            backend:
              - 'apps/backend/src/**'
              - 'apps/backend/tests/**'
            # API surface changes need integration and contract coverage, but do
            # not need the entire unit suite.
            api:
              - 'apps/backend/src/api/**'
              - 'apps/backend/tests/integration/**'
              - 'apps/backend/tests/contract/**'
            # These can invalidate every backend test's runtime or schema.
            full:
              - 'apps/backend/prisma/**'
              - 'apps/backend/package.json'
              - 'apps/backend/tsconfig*.json'
              - 'apps/backend/vitest.config.ts'
              - 'apps/backend/tests/globalSetup.ts'
              - 'apps/backend/tests/setup.ts'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'scripts/run-related-vitest.mjs'
              - '.github/workflows/test-backend.yml'
            files:
              - 'apps/backend/src/**'
              - 'apps/backend/tests/**'

  backend-tests:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: QysywDB_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      PORT: 10002
      DATABASE_URL: mysql://root:123456@127.0.0.1:3306/QysywDB_test
      JWT_ACCESS_SECRET: test_access_secret_key
      JWT_REFRESH_SECRET: test_refresh_secret_key
      JWT_ACCESS_EXPIRES_IN: 5
      JWT_REFRESH_EXPIRES_IN: 28800
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ''
      PROTECTED_GROUP_NAME: __test_protected_group__

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate backend test prerequisites
        run: |
          pnpm --filter @appserver/backend run build:info:stub
          pnpm --filter @appserver/backend run db:generate
      - name: Run the selected backend suite
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          FULL_CHANGED: ${{ needs.changes.outputs.full }}
          MANUAL_SUITE: ${{ inputs.suite }}
        run: |
          if [ "${MANUAL_SUITE}" = "full" ] || [ "${FULL_CHANGED}" = "true" ]; then
            pnpm --filter @appserver/backend run test:ci
          elif [ "${MANUAL_SUITE}" = "api" ] || [ "${API_CHANGED}" = "true" ]; then
            pnpm --filter @appserver/backend run openapi:generate
            pnpm --filter @appserver/backend run test:api
          else
            node scripts/run-related-vitest.mjs apps/backend apps/backend "$CHANGED_FILES"
          fi
      - name: Upload coverage artifact
        if: always() && (inputs.suite == 'full' || needs.changes.outputs.full == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: backend-vitest-coverage
          path: apps/backend/coverage
          if-no-files-found: ignore

name: Backend Test Pipeline

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Manual runs are intentional: select the required suite.'
        type: choice
        default: full
        options: [api, full]
  pull_request:
    branches: [master, staging]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      api: ${{ steps.filter.outputs.api }}
      full: ${{ steps.filter.outputs.full }}
      files: ${{ steps.filter.outputs.files_files || '[]' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            backend:
              - 'apps/backend/src/**'
              - 'apps/backend/tests/**'
            # API surface changes need integration and contract coverage, but do
            # not need the entire unit suite.
            api:
              - 'apps/backend/src/api/**'
              - 'apps/backend/tests/integration/**'
              - 'apps/backend/tests/contract/**'
            # These can invalidate every backend test's runtime or schema.
            full:
              - 'apps/backend/prisma/**'
              - 'apps/backend/package.json'
              - 'apps/backend/tsconfig*.json'
              - 'apps/backend/vitest*.config.ts'
              - 'apps/backend/tests/runtime/**'
              - 'apps/backend/tests/scripts/**'
              - 'apps/backend/tests/setup.ts'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'scripts/run-related-vitest.mjs'
              - '.github/workflows/test-backend.yml'
              - '.github/actions/backend-runtime-tests/**'
            files:
              - 'apps/backend/src/**'
              - 'apps/backend/tests/**'

  backend-unit-tests:
    needs: changes
    if: >-
      always() && (needs.changes.result != 'success' || (
      (github.event_name == 'workflow_dispatch') ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.full == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - &require-change-detection
        name: Require successful change detection
        if: needs.changes.result != 'success'
        run: |
          echo "Change detection did not succeed."
          exit 1
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate unit test prerequisites
        run: |
          pnpm --filter @quyan/backend run build:info:stub
          pnpm --filter @quyan/backend exec bun scripts/iam/generate-action-routes.ts
      - name: Run selected pure backend tests
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
          FULL_CHANGED: ${{ needs.changes.outputs.full }}
          MANUAL_SUITE: ${{ inputs.suite }}
        run: |
          if [ "${MANUAL_SUITE}" = "full" ] || [ "${FULL_CHANGED}" = "true" ]; then
            pnpm --filter @quyan/backend run test:unit
          else
            VITEST_PROJECT_SELECTOR=backend-unit node scripts/run-related-vitest.mjs apps/backend apps/backend "$CHANGED_FILES"
          fi

  # Keep both ruleset check names even when runtime tests are skipped. Matrix
  # expansion would happen after the job condition and omit these names.
  backend-runtime-mysql80:
    name: Backend runtime (MySQL 8.0)
    needs: changes
    if: &backend-runtime-required >-
      always() && (needs.changes.result != 'success' || (
      (github.event_name == 'workflow_dispatch') ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.full == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env: &mysql-env
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: QysywDB_test
        ports: &mysql-ports
          - 3306:3306
        options: &mysql-options >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis: &redis-service
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env: &backend-runtime-env
      NODE_ENV: test
      PORT: 10002
      DATABASE_URL: mysql://root:123456@127.0.0.1:3306/QysywDB_test
      JWT_ACCESS_SECRET: test_access_secret_key
      JWT_REFRESH_SECRET: test_refresh_secret_key
      JWT_ACCESS_EXPIRES_IN: 5
      JWT_REFRESH_EXPIRES_IN: 28800
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ''
      PROTECTED_GROUP_NAME: __test_protected_group__
      TEST_DB_WORKERS: 2
      TEST_REDIS_DB_BASE: 8
      TEST_REDIS_REQUIRED: 'true'

    steps:
      - *require-change-detection
      - uses: actions/checkout@v5
      - uses: ./.github/actions/backend-runtime-tests
        with:
          mysql-version: '8.0'
          changed-files: ${{ needs.changes.outputs.files }}
          api-changed: ${{ needs.changes.outputs.api }}
          full-changed: ${{ needs.changes.outputs.full }}
          manual-suite: ${{ inputs.suite }}

  backend-runtime-mysql57:
    name: Backend runtime (MySQL 5.7)
    needs: changes
    if: *backend-runtime-required
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:5.7
        env: *mysql-env
        ports: *mysql-ports
        options: *mysql-options
      redis: *redis-service
    env: *backend-runtime-env
    steps:
      - *require-change-detection
      - uses: actions/checkout@v5
      - uses: ./.github/actions/backend-runtime-tests
        with:
          mysql-version: '5.7'
          changed-files: ${{ needs.changes.outputs.files }}
          api-changed: ${{ needs.changes.outputs.api }}
          full-changed: ${{ needs.changes.outputs.full }}
          manual-suite: ${{ inputs.suite }}

  # Branch protection also requires the existing aggregate check name.
  backend-runtime-tests:
    needs: [changes, backend-runtime-mysql80, backend-runtime-mysql57]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every selected runtime job to succeed
        env:
          FILTER_RESULT: ${{ needs.changes.result }}
          MYSQL80_RESULT: ${{ needs.backend-runtime-mysql80.result }}
          MYSQL57_RESULT: ${{ needs.backend-runtime-mysql57.result }}
          RUNTIME_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.full == 'true' }}
        run: |
          if [ "$FILTER_RESULT" != "success" ]; then
            echo "Backend change detection did not succeed."
            exit 1
          fi
          for result in "$MYSQL80_RESULT" "$MYSQL57_RESULT"; do
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$result" = "skipped" ] && [ "$RUNTIME_REQUIRED" = "false" ]; then
              echo "No backend runtime tests selected for this change."
              continue
            fi
            echo "Required backend runtime tests did not succeed: $result"
            exit 1
          done

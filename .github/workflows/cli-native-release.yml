name: Quyan Native CLI Release

on:
  push:
    tags:
      - 'quyan-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub Release from the generated artifacts
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: quyan-native-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            rust_target: x86_64-pc-windows-gnu
          - target: linux-x64
            rust_target: x86_64-unknown-linux-musl
          - target: linux-arm64
            rust_target: aarch64-unknown-linux-musl
          - target: macos-x64
            rust_target: x86_64-apple-darwin
          - target: macos-arm64
            rust_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install JavaScript tooling
        run: pnpm install --frozen-lockfile
      - name: Generate backend Swagger
        run: |
          pnpm --filter @quyan/backend run build:info:stub
          pnpm --filter @quyan/backend run openapi:generate
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build native artifact
        env:
          QUYAN_CARGO_TOOL: cargo-zigbuild
          QUYAN_WINDOWS_RUST_TARGET: ${{ matrix.rust_target }}
        run: pnpm exec tsx scripts/cli-native.ts package ${{ matrix.target }}
      - name: Verify artifact metadata and checksum
        shell: bash
        run: |
          file apps/cli-native/dist/release/*
          cd apps/cli-native/dist/release
          sha256sum -c *.sha256
      - name: Linux version smoke test
        if: matrix.target == 'linux-x64'
        run: apps/cli-native/dist/release/quyan-v$(sed -n 's/^version = "\(.*\)"/\1/p' apps/cli-native/Cargo.toml | head -1)-linux-x64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: quyan-${{ matrix.target }}
          path: apps/cli-native/dist/release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/quyan-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: quyan-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" release-assets/* --title "Quyan CLI ${tag#quyan-v}" --generate-notes

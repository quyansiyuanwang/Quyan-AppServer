name: Quality Check

on:
  pull_request:
    branches: [master, staging]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      check-backend:
        description: 'Check backend'
        type: boolean
        default: true
      check-frontend:
        description: 'Check frontend'
        type: boolean
        default: true
      check-docs-site:
        description: 'Check docs site'
        type: boolean
        default: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs-site: ${{ steps.filter.outputs.docs-site }}
      shared: ${{ steps.filter.outputs.shared }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - '.github/workflows/quality-check.yml'
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/quality-check.yml'
            docs-site:
              - 'apps/docs-site/**'
              - '.github/workflows/quality-check.yml'
            shared:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            api:
              - 'apps/backend/src/api/**'

  backend-quality:
    needs: changes
    if: |
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[skip cicd]') &&
      (github.event_name == 'workflow_dispatch' && inputs['check-backend'] ||
       needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate backend prerequisites
        run: |
          pnpm --filter @appserver/backend run build:info:stub
          pnpm --filter @appserver/backend run openapi:generate
          pnpm --filter @appserver/backend run db:generate
          pnpm --filter @appserver/backend run check:explicit-deps
      - name: Check backend in parallel
        run: pnpm run check:backend

  frontend-quality:
    needs: changes
    if: |
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[skip cicd]') &&
       (github.event_name == 'workflow_dispatch' && inputs['check-frontend'] ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The OpenAPI SDK and its swagger input are generated artifacts and are
      # ignored by Git, so this independent runner must create both first.
      - name: Generate frontend prerequisites
        run: |
          pnpm --filter @appserver/backend run build:info:stub
          pnpm --filter @appserver/backend run openapi:generate
          node scripts/sync-swagger-to-frontend.mjs
          pnpm --filter @appserver/frontend run openapi:generate
          pnpm --filter @appserver/frontend run type:generate
      - name: Check frontend in parallel
        run: pnpm run check:frontend

  docs-quality:
    needs: changes
    if: |
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[skip cicd]') &&
      (github.event_name == 'workflow_dispatch' && inputs['check-docs-site'] ||
       needs.changes.outputs.docs-site == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check docs site in parallel
        run: pnpm run check:docs

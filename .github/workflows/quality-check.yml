name: Quality Check

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      check-backend:
        description: 'Check backend'
        type: boolean
        default: true
      check-frontend:
        description: 'Check frontend'
        type: boolean
        default: true
      check-static-site:
        description: 'Check static site'
        type: boolean
        default: true
      check-docs-site:
        description: 'Check docs site'
        type: boolean
        default: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      static-site: ${{ steps.filter.outputs.static-site }}
      docs-site: ${{ steps.filter.outputs.docs-site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            frontend:
              - 'apps/frontend/**'
            static-site:
              - 'apps/static-site/**'
            docs-site:
              - 'apps/docs-site/**'

  quality:
    needs: changes
    if: |
      ( github.event_name == 'workflow_dispatch' ||
        github.event.inputs.check-backend == 'true' || needs.changes.outputs.backend == 'true' || github.event.inputs.check-frontend == 'true' || needs.changes.outputs.frontend == 'true' ||
        github.event.inputs.check-static-site == 'true' || needs.changes.outputs.static-site == 'true' || github.event.inputs.check-docs-site == 'true' || needs.changes.outputs.docs-site == 'true' ) &&
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[skip cicd]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # ── Backend ─────────────────────────────────────────────────
      - name: Check explicit dependencies (backend)
        if: github.event.inputs.check-backend == 'true' || needs.changes.outputs.backend == 'true'
        run: pnpm --filter @appserver/backend run check:explicit-deps

      - name: Inject Empty Build Info (backend)
        if: github.event.inputs.check-backend == 'true' || needs.changes.outputs.backend == 'true'
        run: pnpm --filter @appserver/backend run build:info:stub

      - name: Generate TSOA Routes (backend)
        if: github.event.inputs.check-backend == 'true' || needs.changes.outputs.backend == 'true'
        run: pnpm --filter @appserver/backend run openapi:generate

      - name: Generate Prisma Client (backend)
        if: github.event.inputs.check-backend == 'true' || needs.changes.outputs.backend == 'true'
        run: pnpm --filter @appserver/backend run db:generate

      - name: Lint (backend)
        if: github.event.inputs.check-backend == 'true' || needs.changes.outputs.backend == 'true'
        run: pnpm --filter @appserver/backend run lint:check

      - name: Format check (backend)
        if: github.event.inputs.check-backend == 'true' || needs.changes.outputs.backend == 'true'
        run: pnpm --filter @appserver/backend run format:check

      - name: Type check (backend)
        if: github.event.inputs.check-backend == 'true' || needs.changes.outputs.backend == 'true'
        run: pnpm --filter @appserver/backend run type-check

      # ── Frontend ───────────────────────────────────────────────
      - name: Generate API Client (frontend)
        if: github.event.inputs.check-frontend == 'true' || needs.changes.outputs.frontend == 'true'
        run: pnpm --filter @appserver/frontend run openapi:generate

      - name: Generate Route Types (frontend)
        if: github.event.inputs.check-frontend == 'true' || needs.changes.outputs.frontend == 'true'
        run: pnpm --filter @appserver/frontend run type:generate

      - name: Lint (frontend)
        if: github.event.inputs.check-frontend == 'true' || needs.changes.outputs.frontend == 'true'
        run: pnpm --filter @appserver/frontend run lint:check

      - name: Format check (frontend)
        if: github.event.inputs.check-frontend == 'true' || needs.changes.outputs.frontend == 'true'
        run: pnpm --filter @appserver/frontend run format:check

      - name: Type check (frontend)
        if: github.event.inputs.check-frontend == 'true' || needs.changes.outputs.frontend == 'true'
        run: pnpm --filter @appserver/frontend run type-check

      # ── Static Site ────────────────────────────────────────────
      - name: Lint (static-site)
        if: github.event.inputs.check-static-site == 'true' || needs.changes.outputs.static-site == 'true'
        run: pnpm --filter @appserver/static-site run lint:check

      - name: Format check (static-site)
        if: github.event.inputs.check-static-site == 'true' || needs.changes.outputs.static-site == 'true'
        run: pnpm --filter @appserver/static-site run format:check

      - name: Type check (static-site)
        if: github.event.inputs.check-static-site == 'true' || needs.changes.outputs.static-site == 'true'
        run: pnpm --filter @appserver/static-site run type-check

      # ── Docs Site ──────────────────────────────────────────────
      - name: Lint (docs-site)
        if: github.event.inputs.check-docs-site == 'true' || needs.changes.outputs.docs-site == 'true'
        run: pnpm --filter @appserver/docs-site run lint:check

      - name: Format check (docs-site)
        if: github.event.inputs.check-docs-site == 'true' || needs.changes.outputs.docs-site == 'true'
        run: pnpm --filter @appserver/docs-site run format:check

      - name: Type check (docs-site)
        if: github.event.inputs.check-docs-site == 'true' || needs.changes.outputs.docs-site == 'true'
        run: pnpm --filter @appserver/docs-site run type-check

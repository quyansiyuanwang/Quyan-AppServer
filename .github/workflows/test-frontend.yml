name: Frontend Test Pipeline

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Manual runs are intentional: select the required suite.'
        type: choice
        default: full
        options: [api, full]
  pull_request:
    branches: [master, staging]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}
      full: ${{ steps.filter.outputs.full }}
      files: ${{ steps.filter.outputs.files_files || '[]' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            frontend:
              - 'apps/frontend/src/**'
              - 'apps/frontend/tests/**'
            # A changed backend contract or generated client deserves a full UI
            # suite, because dependency analysis cannot reliably trace codegen.
            api:
              - 'apps/backend/src/api/**'
              - 'apps/backend/src/build/swagger.json'
              - 'apps/frontend/swagger.json'
              - 'apps/frontend/src/client/**'
            # Tooling, shared contracts and test bootstrap changes can affect
            # every UI test; these are the only automatic full-suite cases.
            full:
              - 'apps/frontend/vitest*.config.ts'
              - 'apps/frontend/tests/setup.ts'
              - 'apps/frontend/tests/scripts/**'
              - 'apps/frontend/package.json'
              - 'apps/frontend/tsconfig*.json'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'scripts/run-related-vitest.mjs'
              - '.github/workflows/test-frontend.yml'
            files:
              - 'apps/frontend/src/**'
              - 'apps/frontend/tests/**'

  frontend-tests:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore generated frontend SDK
        id: frontend-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/backend/src/build/swagger.json
            apps/frontend/swagger.json
            apps/frontend/src/client
          key: frontend-sdk-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/backend/src/api/**', 'apps/backend/tsoa.json', 'apps/frontend/openapi-ts.config.ts', 'apps/frontend/scripts/generate-api-constants.js', 'apps/frontend/scripts/generate-api-types-map.js', 'apps/frontend/scripts/generate-replay-protected-endpoints.js') }}
      # src/client is intentionally ignored by Git. Every frontend test needs
      # the generated SDK, even when the changed UI code has no API impact.
      - name: Generate frontend SDK test prerequisite
        if: steps.frontend-sdk-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @quyan/backend run build:info:stub
          pnpm --filter @quyan/backend run openapi:generate
          node scripts/sync-swagger-to-frontend.mjs
          pnpm --filter @quyan/frontend run openapi:generate
      - name: Run the selected frontend suite
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          FULL_CHANGED: ${{ needs.changes.outputs.full }}
          MANUAL_SUITE: ${{ inputs.suite }}
        run: |
          if [ "${MANUAL_SUITE}" = "full" ] || [ "${FULL_CHANGED}" = "true" ]; then
            pnpm --filter @quyan/frontend run test
          elif [ "${MANUAL_SUITE}" = "api" ] || [ "${API_CHANGED}" = "true" ]; then
            pnpm --filter @quyan/frontend run test
          else
            node scripts/run-related-vitest.mjs apps/frontend apps/frontend "$CHANGED_FILES"
          fi
